<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A weekend-paced system design roadmap with tracks, case studies, trade-off guides and a 93-question practice notebook.">
<meta name="theme-color" content="#f4f7fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13181f" media="(prefers-color-scheme: dark)">
<title>System Design Study Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232d5ed4'/%3E%3Cpath d='M8 9h6v5H8zM18 9h6v5h-6zM11 14v3h10v-3M16 17v3' fill='none' stroke='white' stroke-width='1.8' stroke-linejoin='round'/%3E%3Cellipse cx='16' cy='22' rx='4.5' ry='1.6' fill='none' stroke='white' stroke-width='1.8'/%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>try{var t=JSON.parse(localStorage.getItem('sdhub.theme')||'""');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="bg-canvas text-ink">
<a href="#main" class="btn sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50">Skip to content</a>

<!-- top bar: phones and tablets -->
<header class="sticky top-0 z-30 border-b border-line bg-canvas/80 backdrop-blur-xl lg:hidden" style="padding-top: env(safe-area-inset-top)">
  <div class="flex h-14 items-center gap-2 px-3 sm:px-5">
    <a href="#home" class="flex min-w-0 items-center gap-2.5 rounded-lg px-1" data-brand></a>
    <div class="ml-auto flex items-center gap-1">
      <button type="button" class="btn btn-ghost btn-icon" data-action="search" aria-label="Search everything" data-icon="search"></button>
      <button type="button" class="btn btn-ghost btn-icon" data-action="theme" aria-label="Change theme" data-theme-icon></button>
      <button type="button" class="btn btn-ghost btn-icon hidden md:inline-flex" data-action="menu" aria-label="Open menu" data-icon="menu"></button>
    </div>
  </div>
</header>

<div class="mx-auto flex w-full max-w-[112rem]">
  <!-- sidebar: laptops and up -->
  <aside id="sidebar" class="no-scrollbar sticky top-0 hidden h-dvh w-68 shrink-0 flex-col gap-6 overflow-y-auto border-r border-line px-4 py-6 lg:flex" aria-label="Sidebar"></aside>

  <main id="main" class="min-w-0 flex-1 px-4 pt-6 pb-32 sm:px-6 md:pb-20 lg:px-10 lg:pt-10 xl:px-12">
    <div id="view" class="mx-auto w-full max-w-5xl"></div>
  </main>

  <!-- "On this page": wide screens -->
  <aside id="toc" class="no-scrollbar sticky top-0 hidden h-dvh w-60 shrink-0 overflow-y-auto py-10 pr-6 xl:block" aria-label="On this page"></aside>
</div>

<!-- bottom tabs: phones -->
<nav id="tabbar" class="fixed inset-x-0 bottom-0 z-30 border-t border-line bg-canvas/85 backdrop-blur-xl md:hidden" style="padding-bottom: env(safe-area-inset-bottom)" aria-label="Main"></nav>

<dialog id="drawer" class="sheet" aria-label="Menu" tabindex="-1"></dialog>

<dialog id="palette" class="palette" aria-label="Search">
  <div class="flex h-full max-h-[inherit] flex-col">
    <div class="flex items-center gap-3 border-b border-line px-4">
      <span class="text-ink-3" data-icon="search"></span>
      <label for="palette-q" class="sr-only">Search topics, questions, tools, patterns and resources</label>
      <input id="palette-q" type="search" autocomplete="off" spellcheck="false" placeholder="Search topics, questions, case studies, tools..." class="h-14 min-w-0 flex-1 bg-transparent text-base outline-none placeholder:text-ink-3" role="combobox" aria-expanded="true" aria-controls="palette-results" aria-autocomplete="list">
      <button type="button" class="btn btn-ghost btn-sm" data-action="close-palette" aria-label="Close search"><span class="kbd max-sm:hidden">Esc</span><span class="sm:hidden">Close</span></button>
    </div>
    <div id="palette-results" class="min-h-0 flex-1 overflow-y-auto overscroll-contain p-2" role="listbox" aria-label="Results"></div>
    <div class="hidden items-center gap-4 border-t border-line px-4 py-2.5 text-xs text-ink-3 sm:flex">
      <span class="flex items-center gap-1.5"><span class="kbd">↑</span><span class="kbd">↓</span> move</span>
      <span class="flex items-center gap-1.5"><span class="kbd">Enter</span> open</span>
      <span class="flex items-center gap-1.5"><span class="kbd">Esc</span> close</span>
    </div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
